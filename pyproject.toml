[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sulaide-cli"
version = "0.2.0"
description = "CLI for Sulaide Agent workflow API"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
qr = ["qrcode>=7"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "tomli>=2; python_version < '3.11'"]

[project.scripts]
sulaide = "sulaide_cli.cli:main"

# skills/ at the repo root is the single source of truth; it is shipped inside
# the wheel as the sulaide_cli._skills package data so `uv tool install` carries it.
[tool.setuptools]
packages = ["sulaide_cli", "sulaide_cli._skills"]

[tool.setuptools.package-dir]
"sulaide_cli" = "src/sulaide_cli"
"sulaide_cli._skills" = "skills"

[tool.setuptools.package-data]
"sulaide_cli._skills" = ["*/SKILL.md", "*/**/*"]
